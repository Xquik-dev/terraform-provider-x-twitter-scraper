name: Refresh Context7 documentation

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/context7-refresh.yml"
      - "README.md"
      - "context7.json"
      - "docs/**"
      - "examples/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: context7-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh Context7 documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Trigger Context7 refresh
        env:
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$CONTEXT7_API_KEY" ]; then
            echo "::warning ::Context7 refresh is disabled. Add the CONTEXT7_API_KEY secret to enable it."
            exit 0
          fi

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          status="$(curl --connect-timeout 10 --max-time 30 --proto '=https' -sS --tlsv1.2 -o "$body_file" -w "%{http_code}" -X POST "https://context7.com/api/v1/refresh" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${CONTEXT7_API_KEY}" \
            -d '{"libraryName": "/xquik-dev/terraform-provider-x-twitter-scraper"}')"

          case "$status" in
            200|202)
              cat "$body_file"
              ;;
            400)
              if grep -Eiq "active-task|being processed|already.*process" "$body_file"; then
                echo "::warning ::Context7 is busy. The next documentation change will retry."
                cat "$body_file"
              elif grep -Eiq "too-early|minimum .* days|required between updates" "$body_file"; then
                echo "::warning ::Context7 refresh is not due. The next documentation change will retry."
                cat "$body_file"
              else
                echo "::error ::Context7 refresh returned HTTP $status."
                cat "$body_file"
                exit 1
              fi
              ;;
            404)
              echo "::warning ::Context7 has not indexed this library. Retry after indexing finishes."
              cat "$body_file"
              ;;
            401|403)
              echo "::error ::Context7 authentication failed. Replace the CONTEXT7_API_KEY secret."
              exit 1
              ;;
            429)
              echo "::warning ::Context7 rate limited the refresh. The next documentation change will retry."
              ;;
            *)
              echo "::error ::Context7 refresh returned HTTP $status."
              cat "$body_file"
              exit 1
              ;;
          esac
